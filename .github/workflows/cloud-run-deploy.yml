name: Cloud Run Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - prod
      search_disabled:
        description: Emergency disable new dog searches
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      upload_disabled:
        description: Emergency disable new signed upload intents
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      export_disabled:
        description: Emergency disable new user data exports
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      ai_disabled:
        description: Emergency disable new optional agent and AI work
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      realtime_broadcast_disabled:
        description: Emergency suppress optional realtime broadcasts
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      stage11_r2_cutover:
        description: Run the real live-ingest gate against the reviewed Stage 11 R2 database
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: cloud-run-${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGION: australia-southeast1
  REPOSITORY: greyhoundiq

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch
        )
      }}
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - name: Validate distinct workload identities
        shell: bash
        env:
          BUILD_SERVICE_ACCOUNT: ${{ secrets.GCP_BUILD_SERVICE_ACCOUNT }}
          DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          RUNTIME_SERVICE_ACCOUNT: ${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          env_name="${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}"
          for required_name in BUILD_SERVICE_ACCOUNT DEPLOY_SERVICE_ACCOUNT PROJECT_ID; do
            if [ -z "${!required_name}" ]; then
              echo "::error::$required_name is required"
              exit 1
            fi
          done
          runtime_service_account="${RUNTIME_SERVICE_ACCOUNT:-giq-web-$env_name@$PROJECT_ID.iam.gserviceaccount.com}"
          if [ "$BUILD_SERVICE_ACCOUNT" = "$DEPLOY_SERVICE_ACCOUNT" ] || \
             [ "$BUILD_SERVICE_ACCOUNT" = "$runtime_service_account" ] || \
             [ "$DEPLOY_SERVICE_ACCOUNT" = "$runtime_service_account" ]; then
            echo "::error::Build, deploy and runtime service accounts must be distinct."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_BUILD_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Build image
        id: build
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WORKOS_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_WORKOS_REDIRECT_URI }}
          NEXT_PUBLIC_LIVEKIT_URL: ${{ secrets.NEXT_PUBLIC_LIVEKIT_URL }}
        run: |
          set -euo pipefail
          for var_name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_WORKOS_REDIRECT_URI NEXT_PUBLIC_LIVEKIT_URL; do
            if [ -z "${!var_name}" ]; then
              echo "::error::$var_name GitHub secret is required for Cloud Run deploys"
              exit 1
            fi
          done
          env_name="${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}"
          source_sha="$(git rev-parse HEAD)"
          image="$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$REPOSITORY/greyhoundiq-web:$source_sha"
          gcloud builds submit . \
            --config cloudbuild.yaml \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --substitutions "_IMAGE=$image,_NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL,_NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY,_NEXT_PUBLIC_WORKOS_REDIRECT_URI=$NEXT_PUBLIC_WORKOS_REDIRECT_URI,_NEXT_PUBLIC_LIVEKIT_URL=$NEXT_PUBLIC_LIVEKIT_URL"
          image_digest="$(
            gcloud artifacts docker images describe "$image" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --format 'value(image_summary.digest)'
          )"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve an immutable container image digest."
            exit 1
          fi
          immutable_image="${image%:*}@$image_digest"
          echo "env_name=$env_name" >> "$GITHUB_OUTPUT"
          echo "image=$immutable_image" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Cloud Run candidates
        id: deploy
        shell: bash
        env:
          INPUT_SEARCH_DISABLED: ${{ inputs.search_disabled }}
          INPUT_UPLOAD_DISABLED: ${{ inputs.upload_disabled }}
          INPUT_EXPORT_DISABLED: ${{ inputs.export_disabled }}
          INPUT_AI_DISABLED: ${{ inputs.ai_disabled }}
          INPUT_REALTIME_BROADCAST_DISABLED: ${{ inputs.realtime_broadcast_disabled }}
          INPUT_STAGE11_R2_CUTOVER: ${{ inputs.stage11_r2_cutover }}
        run: |
          set -euo pipefail
          env_name="${{ steps.build.outputs.env_name }}"
          case "$env_name" in
            staging|prod) ;;
            *) echo "::error::Unsupported deployment environment: $env_name"; exit 1 ;;
          esac
          project_id="${{ secrets.GCP_PROJECT_ID }}"
          service="greyhoundiq-web-$env_name"
          source_sha="$(git rev-parse HEAD)"
          candidate_tag="candidate-${source_sha:0:12}"
          runtime_sa="${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}"
          if [ -z "$runtime_sa" ]; then
            runtime_sa="giq-web-$env_name@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          fi
          if [ "$runtime_sa" != "giq-web-$env_name@$project_id.iam.gserviceaccount.com" ]; then
            echo "::error::Runtime identity does not match the selected environment and project."
            exit 1
          fi
          min_instances="3"
          max_instances="10"
          actor_conversation_multiplex="${{ vars.ACTOR_CONVERSATION_MULTIPLEX_ENABLED }}"
          if [ "$actor_conversation_multiplex" != "true" ]; then
            actor_conversation_multiplex="false"
          fi
          normalize_emergency_flag() {
            local name="$1"
            local value="$2"
            case "$value" in
              ""|false) printf 'false' ;;
              true) printf 'true' ;;
              *)
                echo "::error::$name must be exactly true or false." >&2
                exit 1
                ;;
            esac
          }
          search_disabled="$(normalize_emergency_flag SEARCH_DISABLED "${INPUT_SEARCH_DISABLED:-}")"
          upload_disabled="$(normalize_emergency_flag UPLOAD_DISABLED "${INPUT_UPLOAD_DISABLED:-}")"
          export_disabled="$(normalize_emergency_flag EXPORT_DISABLED "${INPUT_EXPORT_DISABLED:-}")"
          ai_disabled="$(normalize_emergency_flag AI_DISABLED "${INPUT_AI_DISABLED:-}")"
          realtime_broadcast_disabled="$(normalize_emergency_flag REALTIME_BROADCAST_DISABLED "${INPUT_REALTIME_BROADCAST_DISABLED:-}")"
          stage11_r2_cutover="$(normalize_emergency_flag STAGE11_R2_CUTOVER "${INPUT_STAGE11_R2_CUTOVER:-}")"
          if [ "$stage11_r2_cutover" = "true" ] && [ "$env_name" != "staging" ]; then
            echo "::error::Stage 11 R2 is bound to the reviewed public staging service only."
            exit 1
          fi
          nextauth_url="${{ secrets.NEXTAUTH_URL }}"
          workos_cookie_domain="${{ vars.WORKOS_COOKIE_DOMAIN }}"
          if [ -z "$workos_cookie_domain" ]; then
            workos_cookie_domain="$(
              node -e 'const raw=process.argv[1]; try { const url = new URL(raw); let host = url.hostname.toLowerCase(); if (url.protocol === "https:" && !host.endsWith(".run.app")) { if (host.startsWith("www.")) host = host.slice(4); process.stdout.write(host); } } catch {}' "$nextauth_url"
            )"
          fi
          environment_internal_api_secret="greyhoundiq-$env_name-INTERNAL_API_SECRET"
          reviewed_internal_api_secret="${{ vars.MEDIA_SCANNER_INTERNAL_API_SECRET_NAME }}"
          if [ -z "$reviewed_internal_api_secret" ]; then
            internal_api_secret="$environment_internal_api_secret"
          elif [ "$reviewed_internal_api_secret" = "$environment_internal_api_secret" ] || \
               [ "$reviewed_internal_api_secret" = "giq-internal-api-secret" ]; then
            internal_api_secret="$reviewed_internal_api_secret"
          else
            echo "::error::MEDIA_SCANNER_INTERNAL_API_SECRET_NAME is not an approved environment or generic secret reference."
            exit 1
          fi
          database_secret="greyhoundiq-$env_name-DATABASE_URL"
          replay_proxy_secret="greyhoundiq-$env_name-REPLAY_PROXY_SECRET"
          watchdog_provider_enabled="false"
          if [ "$env_name" = "staging" ]; then
            database_secret="greyhoundiq-stage11-DATABASE_URL"
            replay_proxy_secret="giq-replay-proxy-secret"
            watchdog_provider_enabled="true"
          fi
          if ! gcloud secrets versions list "$database_secret" \
            --project "$project_id" \
            --filter "state=ENABLED" \
            --limit 1 \
            --format "value(name)" | grep -q .; then
            echo "::error::Missing enabled Secret Manager version for $database_secret"
            exit 1
          fi
          for secret_name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY STRIPE_SECRET_KEY NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_PRO_MONTHLY STRIPE_PRICE_PRO_YEARLY REALTIME_CHANNEL_SECRET; do
            if ! gcloud secrets versions list "greyhoundiq-$env_name-$secret_name" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --filter "state=ENABLED" \
              --limit 1 \
              --format "value(name)" | grep -q .; then
              echo "::error::Missing enabled Secret Manager version for greyhoundiq-$env_name-$secret_name"
              exit 1
            fi
          done
          if ! gcloud secrets versions list "$internal_api_secret" \
            --project "$project_id" \
            --filter "state=ENABLED" \
            --limit 1 \
            --format "value(name)" | grep -q .; then
            echo "::error::Missing enabled Secret Manager version for the reviewed INTERNAL_API_SECRET reference."
            exit 1
          fi
          secrets="DATABASE_URL=$database_secret:latest,SUPABASE_URL=greyhoundiq-$env_name-SUPABASE_URL:latest,SUPABASE_SERVICE_ROLE_KEY=greyhoundiq-$env_name-SUPABASE_SERVICE_ROLE_KEY:latest,SUPABASE_JWT_SECRET=greyhoundiq-$env_name-SUPABASE_JWT_SECRET:latest,NEXT_PUBLIC_SUPABASE_URL=greyhoundiq-$env_name-NEXT_PUBLIC_SUPABASE_URL:latest,NEXT_PUBLIC_SUPABASE_ANON_KEY=greyhoundiq-$env_name-NEXT_PUBLIC_SUPABASE_ANON_KEY:latest,NEXTAUTH_SECRET=greyhoundiq-$env_name-NEXTAUTH_SECRET:latest,AUTH_SECRET=greyhoundiq-$env_name-NEXTAUTH_SECRET:latest,REPLAY_PROXY_SECRET=$replay_proxy_secret:latest,WORKOS_CLIENT_ID=greyhoundiq-$env_name-WORKOS_CLIENT_ID:latest,WORKOS_API_KEY=greyhoundiq-$env_name-WORKOS_API_KEY:latest,WORKOS_COOKIE_PASSWORD=greyhoundiq-$env_name-WORKOS_COOKIE_PASSWORD:latest,STRIPE_SECRET_KEY=greyhoundiq-$env_name-STRIPE_SECRET_KEY:latest,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=greyhoundiq-$env_name-NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:latest,STRIPE_WEBHOOK_SECRET=greyhoundiq-$env_name-STRIPE_WEBHOOK_SECRET:latest,STRIPE_PRICE_PRO_MONTHLY=greyhoundiq-$env_name-STRIPE_PRICE_PRO_MONTHLY:latest,STRIPE_PRICE_PRO_YEARLY=greyhoundiq-$env_name-STRIPE_PRICE_PRO_YEARLY:latest,INTERNAL_API_SECRET=$internal_api_secret:latest,LIVEKIT_URL=greyhoundiq-$env_name-LIVEKIT_URL:latest,LIVEKIT_API_KEY=greyhoundiq-$env_name-LIVEKIT_API_KEY:latest,LIVEKIT_API_SECRET=greyhoundiq-$env_name-LIVEKIT_API_SECRET:latest,REALTIME_CHANNEL_SECRET=greyhoundiq-$env_name-REALTIME_CHANNEL_SECRET:latest"
          site_assets_bucket="giq-site-assets-$project_id"
          public_user_media_bucket="giq-public-user-media-$project_id"
          private_user_media_bucket="giq-private-user-media-$project_id"
          env_vars="NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1,NEXTAUTH_URL=$nextauth_url,AUTH_URL=$nextauth_url,STRIPE_APP_URL=$nextauth_url,NEXT_PUBLIC_WORKOS_REDIRECT_URI=${{ secrets.NEXT_PUBLIC_WORKOS_REDIRECT_URI }},NEXT_PUBLIC_ENABLE_DEMO_LISTING_MEDIA=false,NEXT_PUBLIC_ENABLE_DEMO_ACCOUNT=false,ACTOR_CONVERSATION_MULTIPLEX_ENABLED=$actor_conversation_multiplex,MEDIA_SCAN_MODE=disabled,SEARCH_DISABLED=$search_disabled,UPLOAD_DISABLED=$upload_disabled,EXPORT_DISABLED=$export_disabled,AI_DISABLED=$ai_disabled,REALTIME_BROADCAST_DISABLED=$realtime_broadcast_disabled,THEDOGS_LICENSED_USE_APPROVED=false,THEDOGS_PROVIDER_ENABLED=false,WATCHDOG_PROVIDER_ENABLED=$watchdog_provider_enabled,FASTTRACK_PROTOTYPE_ENABLED=false,OBJECT_STORAGE_PROVIDER=gcs,GCS_SITE_ASSETS_BUCKET=$site_assets_bucket,GCS_PUBLIC_USER_MEDIA_BUCKET=$public_user_media_bucket,GCS_PRIVATE_USER_MEDIA_BUCKET=$private_user_media_bucket"
          if [ -n "$workos_cookie_domain" ]; then
            env_vars="$env_vars,WORKOS_COOKIE_DOMAIN=$workos_cookie_domain"
          fi
          gcloud run deploy "$service" \
            --image "${{ steps.build.outputs.image }}" \
            --region "$REGION" \
            --platform managed \
            --service-account "$runtime_sa" \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 2 \
            --cpu-boost \
            --memory 4Gi \
            --concurrency 20 \
            --timeout 900 \
            --min-instances "$min_instances" \
            --max-instances "$max_instances" \
            --no-traffic \
            --tag "$candidate_tag" \
            --set-env-vars "$env_vars" \
            --update-secrets "$secrets" \
            --project "${{ secrets.GCP_PROJECT_ID }}"
          web_revision="$(
            gcloud run services describe "$service" \
              --region "$REGION" \
              --format 'value(status.latestCreatedRevisionName)' \
              --project "${{ secrets.GCP_PROJECT_ID }}"
          )"
          if [ -z "$web_revision" ]; then
            echo "::error::Could not resolve the candidate web revision."
            exit 1
          fi
          candidate_url="$(
            gcloud run services describe "$service" \
              --region "$REGION" \
              --format json \
              --project "${{ secrets.GCP_PROJECT_ID }}" |
              jq -r --arg tag "$candidate_tag" '.status.traffic[] | select(.tag == $tag) | .url'
          )"
          if [[ ! "$candidate_url" =~ ^https:// ]]; then
            echo "::error::Could not resolve the candidate revision URL."
            exit 1
          fi
          scanner_service="greyhoundiq-media-scanner-$env_name"
          scanner_service_account="giq-media-scanner-$env_name@$project_id.iam.gserviceaccount.com"
          if ! gcloud iam service-accounts describe "$scanner_service_account" \
            --project "$project_id" >/dev/null 2>&1; then
            echo "::error::Dedicated media-scanner service account is missing. Run the reviewed scanner reconciler first."
            exit 1
          fi
          web_service_json="$(
            gcloud run services describe "$service" \
              --region "$REGION" \
              --project "$project_id" \
              --format json
          )"
          web_runtime_identity="$(jq -r '.spec.template.spec.serviceAccountName // empty' <<<"$web_service_json")"
          if [ "$web_runtime_identity" != "$runtime_sa" ]; then
            echo "::error::Web runtime identity drifted before scanner deployment."
            exit 1
          fi
          network_interfaces="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/network-interfaces"] // empty' <<<"$web_service_json")"
          vpc_connector="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/vpc-access-connector"] // empty' <<<"$web_service_json")"
          vpc_egress="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/vpc-access-egress"] // empty' <<<"$web_service_json")"
          if { [ -n "$network_interfaces" ] && [ -n "$vpc_connector" ]; } || \
             { [ -z "$network_interfaces" ] && [ -z "$vpc_connector" ]; }; then
            echo "::error::Web service must use exactly one reviewed VPC attachment mode."
            exit 1
          fi
          case "$vpc_egress" in
            private-ranges-only|all-traffic) ;;
            *) echo "::error::Unsupported web VPC egress policy."; exit 1 ;;
          esac
          scanner_network_args=()
          if [ -n "$network_interfaces" ]; then
            if ! jq -e '
              type == "array" and length == 1 and
              (.[0].network | type == "string" and test("^[A-Za-z0-9_./-]+$")) and
              (.[0].subnetwork | type == "string" and test("^[A-Za-z0-9_./-]+$")) and
              ((.[0].tags // []) as $tags |
                ($tags | type == "array") and
                ($tags | all(test("^[a-z0-9-]{1,63}$"))))
            ' >/dev/null <<<"$network_interfaces"; then
              echo "::error::Unsafe or ambiguous direct-VPC configuration."
              exit 1
            fi
            scanner_network_args+=(
              "--network=$(jq -r '.[0].network' <<<"$network_interfaces")"
              "--subnet=$(jq -r '.[0].subnetwork' <<<"$network_interfaces")"
              "--vpc-egress=$vpc_egress"
            )
            network_tags="$(jq -r '(.[0].tags // []) | join(",")' <<<"$network_interfaces")"
            if [ -n "$network_tags" ]; then
              scanner_network_args+=("--network-tags=$network_tags")
            fi
          else
            if [[ ! "$vpc_connector" =~ ^[A-Za-z0-9_./-]+$ ]]; then
              echo "::error::Unsafe VPC connector identifier."
              exit 1
            fi
            scanner_network_args+=("--vpc-connector=$vpc_connector" "--vpc-egress=$vpc_egress")
          fi
          scanner_env_vars="NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1,MEDIA_SCAN_MODE=clamav,REALTIME_BROADCAST_DISABLED=true,OBJECT_STORAGE_PROVIDER=gcs,GCS_SITE_ASSETS_BUCKET=$site_assets_bucket,GCS_PUBLIC_USER_MEDIA_BUCKET=$public_user_media_bucket,GCS_PRIVATE_USER_MEDIA_BUCKET=$private_user_media_bucket"
          scanner_secrets="DATABASE_URL=$database_secret:latest,INTERNAL_API_SECRET=$internal_api_secret:latest"
          gcloud run deploy "$scanner_service" \
            --image "${{ steps.build.outputs.image }}" \
            --region "$REGION" \
            --platform managed \
            --service-account "$scanner_service_account" \
            --no-allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --memory 4Gi \
            --concurrency 1 \
            --timeout 900 \
            --min-instances 0 \
            --max-instances 1 \
            --no-traffic \
            --set-env-vars "$scanner_env_vars" \
            --set-secrets "$scanner_secrets" \
            "${scanner_network_args[@]}" \
            --project "$project_id"
          scanner_service_json="$(
            gcloud run services describe "$scanner_service" \
              --region "$REGION" \
              --format json \
              --project "$project_id"
          )"
          scanner_revision="$(jq -r '.status.latestCreatedRevisionName // empty' <<<"$scanner_service_json")"
          if [ -z "$scanner_revision" ]; then
            echo "::error::Could not resolve the candidate scanner revision."
            exit 1
          fi
          if ! jq -e \
            --arg runtime_sa "$scanner_service_account" \
            --arg image "${{ steps.build.outputs.image }}" \
            --arg site_bucket "$site_assets_bucket" \
            --arg public_bucket "$public_user_media_bucket" \
            --arg private_bucket "$private_user_media_bucket" \
            --arg database_secret "$database_secret" \
            --arg internal_secret "$internal_api_secret" '
              def container: .spec.template.spec.containers[0];
              def binding($name): (container.env[] | select(.name == $name));
              .spec.template.spec.serviceAccountName == $runtime_sa and
              container.image == $image and
              (container.env | length) == 10 and
              ([container.env[].name] | sort) == ([
                "DATABASE_URL", "GCS_PRIVATE_USER_MEDIA_BUCKET",
                "GCS_PUBLIC_USER_MEDIA_BUCKET", "GCS_SITE_ASSETS_BUCKET",
                "INTERNAL_API_SECRET", "MEDIA_SCAN_MODE", "NEXT_TELEMETRY_DISABLED",
                "NODE_ENV", "OBJECT_STORAGE_PROVIDER", "REALTIME_BROADCAST_DISABLED"
              ] | sort) and
              binding("NODE_ENV").value == "production" and
              binding("NEXT_TELEMETRY_DISABLED").value == "1" and
              binding("MEDIA_SCAN_MODE").value == "clamav" and
              binding("REALTIME_BROADCAST_DISABLED").value == "true" and
              binding("OBJECT_STORAGE_PROVIDER").value == "gcs" and
              binding("GCS_SITE_ASSETS_BUCKET").value == $site_bucket and
              binding("GCS_PUBLIC_USER_MEDIA_BUCKET").value == $public_bucket and
              binding("GCS_PRIVATE_USER_MEDIA_BUCKET").value == $private_bucket and
              binding("DATABASE_URL").valueFrom.secretKeyRef == {name: $database_secret, key: "latest"} and
              binding("INTERNAL_API_SECRET").valueFrom.secretKeyRef == {name: $internal_secret, key: "latest"}
            ' >/dev/null <<<"$scanner_service_json"; then
            echo "::error::Scanner environment or secret-reference allowlist verification failed."
            exit 1
          fi
          scanner_network_interfaces="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/network-interfaces"] // empty' <<<"$scanner_service_json")"
          scanner_vpc_connector="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/vpc-access-connector"] // empty' <<<"$scanner_service_json")"
          scanner_vpc_egress="$(jq -r '.spec.template.metadata.annotations["run.googleapis.com/vpc-access-egress"] // empty' <<<"$scanner_service_json")"
          if [ "$scanner_vpc_egress" != "$vpc_egress" ] || [ "$scanner_vpc_connector" != "$vpc_connector" ]; then
            echo "::error::Scanner VPC connector or egress differs from the web service."
            exit 1
          fi
          if [ -n "$network_interfaces" ]; then
            expected_network="$(jq -cS 'map({network, subnetwork, tags: ((.tags // []) | sort)})' <<<"$network_interfaces")"
            actual_network="$(jq -cS 'map({network, subnetwork, tags: ((.tags // []) | sort)})' <<<"$scanner_network_interfaces")"
            if [ "$actual_network" != "$expected_network" ]; then
              echo "::error::Scanner direct-VPC interface differs from the web service."
              exit 1
            fi
          elif [ -n "$scanner_network_interfaces" ]; then
            echo "::error::Scanner has an unexpected direct-VPC interface."
            exit 1
          fi
          gcloud run services add-iam-policy-binding "$scanner_service" \
            --region "$REGION" \
            --member "serviceAccount:$runtime_sa" \
            --role roles/run.invoker \
            --project "$project_id" \
            --quiet
          scanner_url="$(jq -r '.status.url // empty' <<<"$scanner_service_json")"
          scheduler_job="greyhoundiq-$env_name-media-maintenance"
          scheduler_description="GreyhoundIQ $env_name media maintenance; internal-secret=$internal_api_secret:latest"
          scheduler_json="$(
            gcloud scheduler jobs describe "$scheduler_job" \
              --location "$REGION" \
              --project "$project_id" \
              --format json
          )"
          if ! jq -e \
            --arg uri "$scanner_url/api/internal/media-maintenance" \
            --arg identity "$runtime_sa" \
            --arg audience "$scanner_url" \
            --arg description "$scheduler_description" '
              .schedule == "*/5 * * * *" and
              .timeZone == "Australia/Sydney" and
              .description == $description and
              .attemptDeadline == "900s" and
              .retryConfig.retryCount == 3 and
              .httpTarget.uri == $uri and
              .httpTarget.httpMethod == "POST" and
              .httpTarget.oidcToken.serviceAccountEmail == $identity and
              .httpTarget.oidcToken.audience == $audience and
              .httpTarget.headers["Content-Type"] == "application/json" and
              (.httpTarget.headers["x-internal-secret"] as $secret |
                ($secret | type == "string") and
                ($secret | length >= 20))
            ' >/dev/null <<<"$scheduler_json"; then
            echo "::error::Media-maintenance Scheduler auth, environment, method, or deadline drifted."
            exit 1
          fi
          echo "candidate_url=$candidate_url" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=$candidate_tag" >> "$GITHUB_OUTPUT"
          echo "internal_api_secret=$internal_api_secret" >> "$GITHUB_OUTPUT"
          echo "web_revision=$web_revision" >> "$GITHUB_OUTPUT"
          echo "web_service=$service" >> "$GITHUB_OUTPUT"
          echo "scanner_revision=$scanner_revision" >> "$GITHUB_OUTPUT"
          echo "scanner_service=$scanner_service" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          SMOKE_BASE_URL="${{ steps.deploy.outputs.candidate_url }}" npm run test:smoke

      - name: Stage 11 R2 live-ingest and deduplication gate
        if: github.event_name == 'workflow_dispatch' && inputs.stage11_r2_cutover == 'true'
        shell: bash
        run: |
          set -euo pipefail
          internal_secret="$(
            gcloud secrets versions access latest \
              --secret "${{ steps.deploy.outputs.internal_api_secret }}" \
              --project "${{ secrets.GCP_PROJECT_ID }}"
          )"
          if [ -z "$internal_secret" ]; then
            echo "::error::The reviewed internal API secret is empty."
            exit 1
          fi
          echo "::add-mask::$internal_secret"
          candidate_url="${{ steps.deploy.outputs.candidate_url }}"
          for pass in 1 2; do
            for scope in results upcoming; do
              curl --fail --silent --show-error --max-time 900 \
                --request POST \
                --header "x-internal-secret: $internal_secret" \
                "$candidate_url/api/internal/live-sync?days=1&scope=$scope" \
                >/dev/null
            done
          done
          curl --fail --silent --show-error --max-time 60 \
            --header "x-internal-secret: $internal_secret" \
            "$candidate_url/api/health/feeds" \
            >/dev/null
          unset internal_secret
          gcloud run jobs execute giq-production-db-audit \
            --region "$REGION" \
            --wait \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --format "value(metadata.name)"

      - name: Post-deploy LiveKit connectivity check (staging only)
        if: steps.build.outputs.env_name == 'staging'
        shell: bash
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${LIVEKIT_URL:-}" ] || [ -z "${LIVEKIT_API_KEY:-}" ] || [ -z "${LIVEKIT_API_SECRET:-}" ]; then
            echo "::notice::LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET not set — skipping LiveKit connectivity check"
            exit 0
          fi
          npm run check:livekit-connectivity

      - name: Promote tested revisions
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${{ steps.deploy.outputs.web_service }}" \
            --region "$REGION" \
            --to-revisions "${{ steps.deploy.outputs.web_revision }}=100" \
            --remove-tags "${{ steps.deploy.outputs.candidate_tag }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud run services update-traffic "${{ steps.deploy.outputs.scanner_service }}" \
            --region "$REGION" \
            --to-revisions "${{ steps.deploy.outputs.scanner_revision }}=100" \
            --project "${{ secrets.GCP_PROJECT_ID }}"
