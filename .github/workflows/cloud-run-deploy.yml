name: Cloud Run Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - prod
      search_disabled:
        description: Emergency disable new dog searches
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      upload_disabled:
        description: Emergency disable new signed upload intents
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      export_disabled:
        description: Emergency disable new user data exports
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      ai_disabled:
        description: Emergency disable new optional agent and AI work
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      realtime_broadcast_disabled:
        description: Emergency suppress optional realtime broadcasts
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: cloud-run-${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGION: australia-southeast1
  REPOSITORY: greyhoundiq

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch
        )
      }}
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - name: Validate distinct workload identities
        shell: bash
        env:
          BUILD_SERVICE_ACCOUNT: ${{ secrets.GCP_BUILD_SERVICE_ACCOUNT }}
          DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          RUNTIME_SERVICE_ACCOUNT: ${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          env_name="${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}"
          for required_name in BUILD_SERVICE_ACCOUNT DEPLOY_SERVICE_ACCOUNT PROJECT_ID; do
            if [ -z "${!required_name}" ]; then
              echo "::error::$required_name is required"
              exit 1
            fi
          done
          runtime_service_account="${RUNTIME_SERVICE_ACCOUNT:-giq-web-$env_name@$PROJECT_ID.iam.gserviceaccount.com}"
          if [ "$BUILD_SERVICE_ACCOUNT" = "$DEPLOY_SERVICE_ACCOUNT" ] || \
             [ "$BUILD_SERVICE_ACCOUNT" = "$runtime_service_account" ] || \
             [ "$DEPLOY_SERVICE_ACCOUNT" = "$runtime_service_account" ]; then
            echo "::error::Build, deploy and runtime service accounts must be distinct."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_BUILD_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Build image
        id: build
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WORKOS_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_WORKOS_REDIRECT_URI }}
          NEXT_PUBLIC_LIVEKIT_URL: ${{ secrets.NEXT_PUBLIC_LIVEKIT_URL }}
        run: |
          set -euo pipefail
          for var_name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_WORKOS_REDIRECT_URI NEXT_PUBLIC_LIVEKIT_URL; do
            if [ -z "${!var_name}" ]; then
              echo "::error::$var_name GitHub secret is required for Cloud Run deploys"
              exit 1
            fi
          done
          env_name="${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}"
          source_sha="$(git rev-parse HEAD)"
          image="$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$REPOSITORY/greyhoundiq-web:$source_sha"
          gcloud builds submit . \
            --config cloudbuild.yaml \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --substitutions "_IMAGE=$image,_NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL,_NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY,_NEXT_PUBLIC_WORKOS_REDIRECT_URI=$NEXT_PUBLIC_WORKOS_REDIRECT_URI,_NEXT_PUBLIC_LIVEKIT_URL=$NEXT_PUBLIC_LIVEKIT_URL"
          image_digest="$(
            gcloud artifacts docker images describe "$image" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --format 'value(image_summary.digest)'
          )"
          if [[ ! "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve an immutable container image digest."
            exit 1
          fi
          immutable_image="${image%:*}@$image_digest"
          echo "env_name=$env_name" >> "$GITHUB_OUTPUT"
          echo "image=$immutable_image" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Cloud Run candidates
        id: deploy
        shell: bash
        env:
          INPUT_SEARCH_DISABLED: ${{ inputs.search_disabled }}
          INPUT_UPLOAD_DISABLED: ${{ inputs.upload_disabled }}
          INPUT_EXPORT_DISABLED: ${{ inputs.export_disabled }}
          INPUT_AI_DISABLED: ${{ inputs.ai_disabled }}
          INPUT_REALTIME_BROADCAST_DISABLED: ${{ inputs.realtime_broadcast_disabled }}
        run: |
          set -euo pipefail
          env_name="${{ steps.build.outputs.env_name }}"
          service="greyhoundiq-web-$env_name"
          source_sha="$(git rev-parse HEAD)"
          candidate_tag="candidate-${source_sha:0:12}"
          runtime_sa="${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}"
          if [ -z "$runtime_sa" ]; then
            runtime_sa="giq-web-$env_name@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"
          fi
          min_instances="3"
          max_instances="10"
          actor_conversation_multiplex="${{ vars.ACTOR_CONVERSATION_MULTIPLEX_ENABLED }}"
          if [ "$actor_conversation_multiplex" != "true" ]; then
            actor_conversation_multiplex="false"
          fi
          normalize_emergency_flag() {
            local name="$1"
            local value="$2"
            case "$value" in
              ""|false) printf 'false' ;;
              true) printf 'true' ;;
              *)
                echo "::error::$name must be exactly true or false." >&2
                exit 1
                ;;
            esac
          }
          search_disabled="$(normalize_emergency_flag SEARCH_DISABLED "${INPUT_SEARCH_DISABLED:-}")"
          upload_disabled="$(normalize_emergency_flag UPLOAD_DISABLED "${INPUT_UPLOAD_DISABLED:-}")"
          export_disabled="$(normalize_emergency_flag EXPORT_DISABLED "${INPUT_EXPORT_DISABLED:-}")"
          ai_disabled="$(normalize_emergency_flag AI_DISABLED "${INPUT_AI_DISABLED:-}")"
          realtime_broadcast_disabled="$(normalize_emergency_flag REALTIME_BROADCAST_DISABLED "${INPUT_REALTIME_BROADCAST_DISABLED:-}")"
          nextauth_url="${{ secrets.NEXTAUTH_URL }}"
          workos_cookie_domain="${{ vars.WORKOS_COOKIE_DOMAIN }}"
          if [ -z "$workos_cookie_domain" ]; then
            workos_cookie_domain="$(
              node -e 'const raw=process.argv[1]; try { const url = new URL(raw); let host = url.hostname.toLowerCase(); if (url.protocol === "https:" && !host.endsWith(".run.app")) { if (host.startsWith("www.")) host = host.slice(4); process.stdout.write(host); } } catch {}' "$nextauth_url"
            )"
          fi
          for secret_name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY STRIPE_SECRET_KEY NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_PRO_MONTHLY STRIPE_PRICE_PRO_YEARLY REALTIME_CHANNEL_SECRET; do
            if ! gcloud secrets versions list "greyhoundiq-$env_name-$secret_name" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --filter "state=ENABLED" \
              --limit 1 \
              --format "value(name)" | grep -q .; then
              echo "::error::Missing enabled Secret Manager version for greyhoundiq-$env_name-$secret_name"
              exit 1
            fi
          done
          secrets="DATABASE_URL=greyhoundiq-$env_name-DATABASE_URL:latest,SUPABASE_URL=greyhoundiq-$env_name-SUPABASE_URL:latest,SUPABASE_SERVICE_ROLE_KEY=greyhoundiq-$env_name-SUPABASE_SERVICE_ROLE_KEY:latest,SUPABASE_JWT_SECRET=greyhoundiq-$env_name-SUPABASE_JWT_SECRET:latest,NEXT_PUBLIC_SUPABASE_URL=greyhoundiq-$env_name-NEXT_PUBLIC_SUPABASE_URL:latest,NEXT_PUBLIC_SUPABASE_ANON_KEY=greyhoundiq-$env_name-NEXT_PUBLIC_SUPABASE_ANON_KEY:latest,NEXTAUTH_SECRET=greyhoundiq-$env_name-NEXTAUTH_SECRET:latest,AUTH_SECRET=greyhoundiq-$env_name-AUTH_SECRET:latest,REPLAY_PROXY_SECRET=greyhoundiq-$env_name-REPLAY_PROXY_SECRET:latest,WORKOS_CLIENT_ID=greyhoundiq-$env_name-WORKOS_CLIENT_ID:latest,WORKOS_API_KEY=greyhoundiq-$env_name-WORKOS_API_KEY:latest,WORKOS_COOKIE_PASSWORD=greyhoundiq-$env_name-WORKOS_COOKIE_PASSWORD:latest,LAGO_API_KEY=greyhoundiq-$env_name-LAGO_API_KEY:latest,LAGO_WEBHOOK_SECRET=greyhoundiq-$env_name-LAGO_WEBHOOK_SECRET:latest,STRIPE_SECRET_KEY=greyhoundiq-$env_name-STRIPE_SECRET_KEY:latest,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=greyhoundiq-$env_name-NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:latest,STRIPE_WEBHOOK_SECRET=greyhoundiq-$env_name-STRIPE_WEBHOOK_SECRET:latest,STRIPE_PRICE_PRO_MONTHLY=greyhoundiq-$env_name-STRIPE_PRICE_PRO_MONTHLY:latest,STRIPE_PRICE_PRO_YEARLY=greyhoundiq-$env_name-STRIPE_PRICE_PRO_YEARLY:latest,INTERNAL_API_SECRET=greyhoundiq-$env_name-INTERNAL_API_SECRET:latest,LIVEKIT_URL=greyhoundiq-$env_name-LIVEKIT_URL:latest,LIVEKIT_API_KEY=greyhoundiq-$env_name-LIVEKIT_API_KEY:latest,LIVEKIT_API_SECRET=greyhoundiq-$env_name-LIVEKIT_API_SECRET:latest,REALTIME_CHANNEL_SECRET=greyhoundiq-$env_name-REALTIME_CHANNEL_SECRET:latest"
          env_vars="NODE_ENV=production,NEXT_TELEMETRY_DISABLED=1,NEXTAUTH_URL=$nextauth_url,AUTH_URL=$nextauth_url,STRIPE_APP_URL=$nextauth_url,NEXT_PUBLIC_WORKOS_REDIRECT_URI=${{ secrets.NEXT_PUBLIC_WORKOS_REDIRECT_URI }},LAGO_API_URL=${{ secrets.LAGO_API_URL }},LAGO_FRONT_URL=${{ secrets.LAGO_FRONT_URL }},NEXT_PUBLIC_ENABLE_DEMO_LISTING_MEDIA=false,NEXT_PUBLIC_ENABLE_DEMO_ACCOUNT=false,ACTOR_CONVERSATION_MULTIPLEX_ENABLED=$actor_conversation_multiplex,MEDIA_SCAN_MODE=disabled,SEARCH_DISABLED=$search_disabled,UPLOAD_DISABLED=$upload_disabled,EXPORT_DISABLED=$export_disabled,AI_DISABLED=$ai_disabled,REALTIME_BROADCAST_DISABLED=$realtime_broadcast_disabled"
          if [ -n "$workos_cookie_domain" ]; then
            env_vars="$env_vars,WORKOS_COOKIE_DOMAIN=$workos_cookie_domain"
          fi
          gcloud run deploy "$service" \
            --image "${{ steps.build.outputs.image }}" \
            --region "$REGION" \
            --platform managed \
            --service-account "$runtime_sa" \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 2 \
            --cpu-boost \
            --memory 4Gi \
            --concurrency 20 \
            --timeout 900 \
            --min-instances "$min_instances" \
            --max-instances "$max_instances" \
            --no-traffic \
            --tag "$candidate_tag" \
            --set-env-vars "$env_vars" \
            --update-secrets "$secrets" \
            --project "${{ secrets.GCP_PROJECT_ID }}"
          web_revision="$(
            gcloud run services describe "$service" \
              --region "$REGION" \
              --format 'value(status.latestCreatedRevisionName)' \
              --project "${{ secrets.GCP_PROJECT_ID }}"
          )"
          if [ -z "$web_revision" ]; then
            echo "::error::Could not resolve the candidate web revision."
            exit 1
          fi
          candidate_url="$(
            gcloud run services describe "$service" \
              --region "$REGION" \
              --format json \
              --project "${{ secrets.GCP_PROJECT_ID }}" |
              jq -r --arg tag "$candidate_tag" '.status.traffic[] | select(.tag == $tag) | .url'
          )"
          if [[ ! "$candidate_url" =~ ^https:// ]]; then
            echo "::error::Could not resolve the candidate revision URL."
            exit 1
          fi
          scanner_service="greyhoundiq-media-scanner-$env_name"
          scanner_env_vars="${env_vars/MEDIA_SCAN_MODE=disabled/MEDIA_SCAN_MODE=clamav}"
          gcloud run deploy "$scanner_service" \
            --image "${{ steps.build.outputs.image }}" \
            --region "$REGION" \
            --platform managed \
            --service-account "$runtime_sa" \
            --no-allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --memory 4Gi \
            --concurrency 1 \
            --timeout 900 \
            --min-instances 0 \
            --max-instances 1 \
            --no-traffic \
            --set-env-vars "$scanner_env_vars" \
            --update-secrets "$secrets" \
            --project "${{ secrets.GCP_PROJECT_ID }}"
          scanner_revision="$(
            gcloud run services describe "$scanner_service" \
              --region "$REGION" \
              --format 'value(status.latestCreatedRevisionName)' \
              --project "${{ secrets.GCP_PROJECT_ID }}"
          )"
          if [ -z "$scanner_revision" ]; then
            echo "::error::Could not resolve the candidate scanner revision."
            exit 1
          fi
          gcloud run services add-iam-policy-binding "$scanner_service" \
            --region "$REGION" \
            --member "serviceAccount:$runtime_sa" \
            --role roles/run.invoker \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --quiet
          echo "candidate_url=$candidate_url" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=$candidate_tag" >> "$GITHUB_OUTPUT"
          echo "web_revision=$web_revision" >> "$GITHUB_OUTPUT"
          echo "web_service=$service" >> "$GITHUB_OUTPUT"
          echo "scanner_revision=$scanner_revision" >> "$GITHUB_OUTPUT"
          echo "scanner_service=$scanner_service" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          SMOKE_BASE_URL="${{ steps.deploy.outputs.candidate_url }}" npm run test:smoke

      - name: Post-deploy LiveKit connectivity check (staging only)
        if: steps.build.outputs.env_name == 'staging'
        shell: bash
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${LIVEKIT_URL:-}" ] || [ -z "${LIVEKIT_API_KEY:-}" ] || [ -z "${LIVEKIT_API_SECRET:-}" ]; then
            echo "::notice::LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET not set — skipping LiveKit connectivity check"
            exit 0
          fi
          npm run check:livekit-connectivity

      - name: Promote tested revisions
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${{ steps.deploy.outputs.web_service }}" \
            --region "$REGION" \
            --to-revisions "${{ steps.deploy.outputs.web_revision }}=100" \
            --remove-tags "${{ steps.deploy.outputs.candidate_tag }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}"
          gcloud run services update-traffic "${{ steps.deploy.outputs.scanner_service }}" \
            --region "$REGION" \
            --to-revisions "${{ steps.deploy.outputs.scanner_revision }}=100" \
            --project "${{ secrets.GCP_PROJECT_ID }}"
