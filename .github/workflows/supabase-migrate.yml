name: Supabase Migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Supabase environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      seed:
        description: "Seed after migration"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate-${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      DATABASE_URL: ${{ inputs.environment == 'production' && secrets.PROD_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify database secret
        run: test -n "$DATABASE_URL" || (echo "Missing database URL secret for ${{ inputs.environment }}" && exit 1)

      - name: Block production seed
        if: ${{ inputs.environment == 'production' && inputs.seed == true }}
        run: |
          echo "Production seed is blocked. Use reviewed forward migrations only."
          exit 1

      - run: npx prisma validate
      - run: npm run check:migrations
      - name: Prepare large indexes without blocking writes
        run: npm run db:indexes:prepare
      - run: npx prisma migrate deploy

      - name: Seed staging data
        if: ${{ inputs.environment != 'production' && inputs.seed == true }}
        run: npm run db:seed
