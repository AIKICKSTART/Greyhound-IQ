map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location ^~ /realtime/v1/api/tenants {
    return 403;
  }

  location ^~ /realtime/v1/api/openapi {
    return 403;
  }

  location ^~ /realtime/v1/api/ {
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Host realtime-dev.supabase-realtime;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Api-Key $http_apikey;
    rewrite ^/realtime/v1/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:4000;
  }

  location ^~ /realtime/v1/ {
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Host realtime-dev.supabase-realtime;
    proxy_set_header X-Api-Key $arg_apikey;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
    proxy_pass http://127.0.0.1:4000;
  }

  location ~ ^/rest/v1/rpc/giq_(replace|revoke)_realtime_topic_grants$ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Profile public;
    proxy_set_header Accept-Profile public;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3000;
  }

  location / {
    return 404;
  }
}
