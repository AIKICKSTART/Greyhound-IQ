    const researchSections=[
      ['Understand the trainer’s real job',`A trainer is simultaneously an animal carer, sports trainer, kennel manager, medication-record keeper, transport coordinator, racing administrator, owner relationship manager, small-business operator and rehoming coordinator.<br><br><strong>Product implication:</strong> begin with “What does each dog need today, was it completed, and what changed?” rather than an analytics dashboard.`],
      ['One reliable view of every dog',`Different career stages, owners, diets, medication, restrictions, training and staff make memory alone unreliable. The Today board must unite status, feed, exercise, treatment, weight, racing, owner and regulatory tasks with responsibility and completion.`],
      ['Extremely fast, complete recording',`Treatment records need the dog, date, time, treatment, route, quantity and administering or authorising person. The interface should prefill known details, support confirmed voice capture, warn about a specific missing field, preserve corrections and generate inspection or transfer exports.<br><br><strong>Safeguard:</strong> the product never guarantees that a dog is safe to race after treatment.`],
      ['A working layer above official systems',`Greyhounds IQ should not replace eTrac, OzChase or FastTrack. Record the activity once, retain the operational record, generate compatible exports, identify the remaining official transaction and connect only where permitted. The trainer always keeps a complete copy.`],
      ['Trust is as important as functionality',`The product must feel like the trainer’s system: assistance rather than surveillance, evidence of good care rather than fault-finding, and guidance rather than unexplained warnings. Nothing is shared externally without explicit authority and a clear explanation.`],
      ['Different trainers need different depth',`<strong>Small owner-trainer:</strong> fast mobile records, reminders, simple calendar and low setup.<br><strong>Public trainer:</strong> owner access, weekly reports, agreements, approvals, invoices and communication history.<br><strong>Larger kennel:</strong> staff roles, sign-off, medication permissions, feed preparation, stock, vehicles and management reporting.`],
      ['Eight ranked product needs',`<ol><li>Daily kennel command centre</li><li>Dog timeline and compliant treatment record</li><li>Health observation and rehabilitation</li><li>Owner communication and business administration</li><li>Race, trial and travel planner</li><li>Nutrition, weight and kennel inventory</li><li>Whole-of-life and rehoming management</li><li>Explainable performance intelligence after reliable operational data exists</li></ol>`],
      ['Wants come after the operational foundation',`Video tagging, gait comparison, wearables, predictive risk, bloodwork trends, voice assistants, feed optimisation, benchmarking and AI suggestions may differentiate later plans. They should not distract from daily care, treatment and records first.`],
      ['What not to build',`Do not start with an AI trainer replacement, duplicate entry, accounting-software density, mandatory sensors, punitive compliance language or a generic boarding-kennel clone. Use large controls, few taps, confirmed voice, offline-safe capture and plain explanations.`],
      ['Recommended first product',`Six primary areas connect through one dog identity and timeline: Today; Dog; universal Record; Calendar; Owners and staff; Records and exports. The expanded professional system adds Training, Health, Race planning and Staff & business without creating disconnected databases.`],
      ['Winning experience standards',`Routine records target under 30 seconds and common actions no more than three taps. One-handed operation, poor-connectivity resilience, role-based access, immutable instructions, traceable edits, paper-ready records, state context and complete data ownership are core—not add-ons.`],
      ['Needs create adoption; wants create differentiation',`Trainers need today’s plan, fast treatment records, regulatory reminders, continuous history, change detection, coordination, practical race choice, clear owner communication, documented decisions and control of their data. Voice, automated reports, video, stock tools and AI summaries become valuable after trust is earned.`],
      ['Validate in kennels before production',`Desk research does not prove time saved, willingness to pay, current duplication, paper dependence, trust barriers or permitted integration paths. Next: five small owner-trainers, five public trainers, three larger kennels and two new trainers, with at least three in-kennel observations. Ask people to show yesterday’s work and every tool they used—not just list desired features.`]
    ];
    function researchView(){return `<section class="view"><div class="panel research-hero"><div class="eyebrow">Research conclusion · July 2026</div><h2>The trainer’s memory, daily run sheet, compliant record, owner communication system and evidence base—in one place.</h2><p>The strongest opportunity is a trainer-controlled kennel operating system that records daily care once, then reuses it for compliance, staff instructions, owner updates, race planning and business administration.</p><div class="promise">Enter it once. Know what needs doing. Prove it was done.</div></div><div class="research-layout"><div class="research-list">${researchSections.map((x,i)=>`<details ${i===0?'open':''}><summary><span>${String(i+1).padStart(2,'0')}</span>${x[0]}</summary><div class="research-copy">${x[1]}</div></details>`).join('')}</div><aside class="panel research-side"><div class="panel-head"><h3>Product guardrails</h3></div><div class="panel-body"><h4>Build first</h4><ul><li>Today command centre</li><li>Six-card roster and profiles</li><li>Universal quick log</li><li>Care, treatment and reminders</li><li>Calendar and core exports</li></ul><h4>AI may assist</h4><ul><li>Find and summarise records</li><li>Detect missing information</li><li>Generate editable reports</li><li>Explain evidence patterns</li></ul><h4>AI must not</h4><ul><li>Prescribe training</li><li>Diagnose injury</li><li>Override veterinary restrictions</li><li>Make unexplained decisions</li></ul></div></aside></div><div style="height:18px"></div><section class="panel"><div class="panel-head"><h3>Delivery sequence</h3><span class="tag gold">Trust before advanced AI</span></div><div class="panel-body"><div class="phase"><b>1</b><div><strong>Kennel Companion MVP</strong><small>Daily command centre, profiles, quick log, care, calendar and exports.</small></div></div><div class="phase"><b>2</b><div><strong>Owners & staff</strong><small>Role access, reports, approvals, agreements, accounts and transfers.</small></div></div><div class="phase"><b>3</b><div><strong>Performance & racing</strong><small>Individual baselines, video comparison and explainable suitability.</small></div></div><div class="phase"><b>4</b><div><strong>Ecosystem & scale</strong><small>Permitted official integrations, accounting, veterinary and multi-kennel tools.</small></div></div></div></section></section>`}

    function openCard(id){const d=dogBy(id);overlay(`<div class="card-viewer" role="dialog" aria-modal="true" aria-label="${esc(d.name)} GHIQ card" data-stop><img src="${d.card}" alt="Full GHIQ collector card for ${esc(d.name)}"><button class="icon-button" data-action="close-overlay" aria-label="Close card">${icon('close')}</button></div>`)}
    function startLog(dogId,type){state.log={step:1,dog:dogId?dogBy(dogId):null,type:type||'',data:{date:'2026-07-15',time:'07:15',admin:'Mark Gatt',product:'Metacam 1.5mg/ml',route:'Oral',dose:'5 ml',vet:'Dr Lisa Chalmers',notes:''}};if(type)state.log.step=dogId?3:2;openLog()}
    function logFields(){const t=state.log.type,d=state.log.data;if(t==='Treatment')return `<div class="form-grid"><div class="field full"><label>Treatment / medication</label><input data-log-field="product" value="${esc(d.product)}"></div><div class="field"><label>Administration route</label><select data-log-field="route"><option>Oral</option><option>Topical</option><option>Injection</option><option>Other</option></select></div><div class="field"><label>Quantity / dose</label><input data-log-field="dose" value="${esc(d.dose)}"></div><div class="field"><label>Date</label><input type="date" data-log-field="date" value="${d.date}"></div><div class="field"><label>Time</label><input type="time" data-log-field="time" value="${d.time}"></div><div class="field"><label>Administered by</label><input data-log-field="admin" value="${esc(d.admin)}"></div><div class="field"><label>Prescribing veterinarian</label><input data-log-field="vet" value="${esc(d.vet)}"></div><div class="field full"><label>Notes / veterinary instructions</label><textarea data-log-field="notes" placeholder="Optional context">${esc(d.notes)}</textarea></div></div>`;if(t==='Training')return `<div class="form-grid"><div class="field"><label>Activity</label><select data-log-field="product"><option>Light exercise</option><option>Track gallop</option><option>Treadmill</option><option>Recovery walk</option><option>Trial</option></select></div><div class="field"><label>Distance / duration</label><input data-log-field="dose" value="520 m"></div><div class="field"><label>Intensity</label><select data-log-field="route"><option>Light</option><option>Moderate</option><option>Fast work</option></select></div><div class="field"><label>Time</label><input type="time" data-log-field="time" value="07:15"></div><div class="field full"><label>Recovery and notes</label><textarea data-log-field="notes" placeholder="Recovery, movement, conditions…"></textarea></div></div>`;if(t==='Weight')return `<div class="form-grid"><div class="field"><label>Weight</label><input data-log-field="dose" value="${state.log.dog?.weight.replace(' kg','')||''}" inputmode="decimal"></div><div class="field"><label>Unit</label><select data-log-field="route"><option>kg</option></select></div><div class="field"><label>Body condition</label><select data-log-field="product"><option>Ideal</option><option>Monitor</option><option>Below target</option><option>Above target</option></select></div><div class="field"><label>Time</label><input type="time" data-log-field="time" value="07:15"></div><div class="field full"><label>Notes</label><textarea data-log-field="notes"></textarea></div></div>`;if(t==='Welfare')return `<div class="form-grid"><div class="field"><label>Observation</label><select data-log-field="product"><option>Daily welfare check</option><option>Health concern</option><option>Behaviour change</option><option>Rehabilitation review</option></select></div><div class="field"><label>Body area</label><select data-log-field="route"><option>No concern</option><option>Left front</option><option>Right front</option><option>Left hind / hock</option><option>Right hind / hock</option></select></div><div class="field"><label>Status</label><select data-log-field="dose"><option>Normal</option><option>Monitor</option><option>Restricted</option><option>Veterinary review</option></select></div><div class="field"><label>Time</label><input type="time" data-log-field="time" value="07:15"></div><div class="field full"><label>Observation notes</label><textarea data-log-field="notes" placeholder="Appetite, behaviour, gait, injury or restriction…"></textarea></div></div>`;if(t==='Feed')return `<div class="form-grid"><div class="field"><label>Meal / change</label><select data-log-field="product"><option>Morning feed</option><option>Evening feed</option><option>Feed change</option><option>Supplement</option></select></div><div class="field"><label>Quantity</label><input data-log-field="dose" value="500 g"></div><div class="field"><label>Response</label><select data-log-field="route"><option>Consumed all</option><option>Reduced appetite</option><option>Refused</option></select></div><div class="field"><label>Time</label><input type="time" data-log-field="time" value="07:15"></div><div class="field full"><label>Notes</label><textarea data-log-field="notes"></textarea></div></div>`;return `<div class="form-grid"><div class="field"><label>Note type</label><select data-log-field="product"><option>General note</option><option>Owner communication</option><option>Behaviour</option><option>Race note</option><option>Document added</option></select></div><div class="field"><label>Time</label><input type="time" data-log-field="time" value="07:15"></div><div class="field full"><label>Details</label><textarea data-log-field="notes" placeholder="Enter the structured note…"></textarea></div></div>`}
    function logBody(){const l=state.log;if(l.step===1)return `<h3>What are you recording?</h3><p>Choose the record type. Only relevant fields appear.</p><div class="choice-list">${logTypes.map(t=>`<button class="choice ${t.gold?'gold-choice':''}" data-log-type="${t.id}"><span class="choice-icon">${icon(t.icon)}</span><span><strong>${t.label}</strong><small>${t.desc}</small></span>${icon('chevron')}</button>`).join('')}</div>`;if(l.step===2)return `<h3>Select the dog</h3><p>Confirm the greyhound before entering details.</p><div class="choice-list">${dogs.map(d=>`<button class="choice" data-log-dog="${d.id}"><img class="dog-thumb" src="${d.card}" alt=""><span><strong>${d.name}</strong><small>${d.colour} · ${d.weight} · ${d.status}</small></span>${icon('chevron')}</button>`).join('')}</div>`;if(l.step===3)return `<h3>${esc(l.type)} details</h3><p>${esc(l.dog.name)} · complete only the fields needed for this record.</p><button class="voice" data-action="voice-fill">${icon('mic')}Tap to simulate confirmed voice capture</button>${logFields()}`;const d=l.data;return `<h3>Review before saving</h3><p>Confirm the structured record. Saving updates the dog timeline and recent activity.</p><div class="review-card"><div class="review-dog"><img src="${l.dog.card}" alt=""><div><strong>${l.dog.name}</strong><div class="muted tiny">${l.dog.colour} · ${l.dog.weight}</div></div></div><div class="review-grid"><div><small>RECORD TYPE</small><b>${esc(l.type)}</b></div><div><small>DATE & TIME</small><b>${esc(d.date)} · ${esc(d.time)}</b></div><div><small>ACTIVITY / PRODUCT</small><b>${esc(d.product)}</b></div><div><small>ROUTE / INTENSITY</small><b>${esc(d.route)}</b></div><div><small>QUANTITY / STATUS</small><b>${esc(d.dose)}</b></div><div><small>RECORDED BY</small><b>${esc(d.admin)}</b></div>${d.notes?`<div style="grid-column:1/-1"><small>NOTES</small><b>${esc(d.notes)}</b></div>`:''}</div></div><div class="why">This demo keeps the record on this device. Production sharing, official submission and race clearance would require separate explicit authority and validation.</div>`}
    function openLog(){const l=state.log;overlay(`<aside class="drawer wide" role="dialog" aria-modal="true" aria-label="Quick Log" data-stop><div class="wizard"><div class="drawer-head"><button class="btn" data-action="close-overlay">Cancel</button><h2 style="margin-left:auto;margin-right:auto">Quick Log</h2></div><div class="wizard-progress">${['Type','Dog','Details','Review'].map((x,i)=>`<span class="step ${l.step===i+1?'active':l.step>i+1?'done':''}">${x}</span>`).join('')}</div><div class="wizard-content">${logBody()}</div><div class="wizard-foot">${l.step>1?`<button class="btn" data-action="log-back">${icon('back')}Back</button>`:''}${l.step===3?`<button class="btn primary" data-action="log-next">Review entry${icon('chevron')}</button>`:l.step===4?`<button class="btn primary" data-action="log-save">${icon('check')}Save record</button>`:''}</div></div></aside>`);document.querySelectorAll('.field').forEach(f=>{const input=f.querySelector('input,select,textarea');if(input)input.setAttribute('aria-label',f.querySelector('label')?.textContent||'Record field')})}
    function saveLog(){const l=state.log;const detail=[l.data.product,l.data.dose,l.data.route].filter(Boolean).join(' · ');state.activities.unshift({dog:l.dog.id,type:`${l.type} recorded`,detail,time:'Just now'});persist();closeOverlay();state.previousView=state.view;state.dog=l.dog;toast(`${l.type} saved to ${l.dog.name}’s timeline`);state.log=null;go('profile')}
    function generateExport(name){const payload={export:name,generatedAt:new Date().toISOString(),prototype:true,dogs:dogs.map(({card,...d})=>d),activities:state.activities,completedTasks:[...state.completed],notice:'Synthetic Trainer OS demonstration data. Not an official or compliance record.'};const blob=new Blob([name==='Full structured backup'?JSON.stringify(payload,null,2):`${name}\nGreyhounds IQ Trainer OS — Demo export\nGenerated: ${new Date().toLocaleString('en-AU')}\n\n${state.activities.map(a=>`${dogBy(a.dog).name} | ${a.type} | ${a.detail} | ${a.time}`).join('\n')}\n\nSynthetic demonstration data only.`],{type:name==='Full structured backup'?'application/json':'text/plain'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}-demo.${name==='Full structured backup'?'json':'txt'}`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`${name} generated from demo records`)}
    document.addEventListener('click',e=>{
      const t=e.target.closest('button,[data-dog],[data-task],[data-card],[data-view]');if(!t)return;
      if(t.dataset.stop!==undefined){e.stopPropagation();return}
      if(t.dataset.view){closeOverlay();go(t.dataset.view);return}
      if(t.dataset.dog){closeOverlay();openProfile(t.dataset.dog);return}
      if(t.dataset.task){openTask(t.dataset.task);return}
      if(t.dataset.card){openCard(t.dataset.card);return}
      if(t.dataset.roster){state.rosterMode=t.dataset.roster;render();return}
      if(t.dataset.filter){state.dogFilter=t.dataset.filter;render();return}
      if(t.dataset.tab){state.profileTab=t.dataset.tab;render();return}
      if(t.dataset.day){state.calendarDay=Number(t.dataset.day);render();return}
      if(t.dataset.raceDog){state.dog=dogBy(t.dataset.raceDog);render();return}
      if(t.dataset.nominate){state.nominated.add(`${state.dog.id}-${t.dataset.nominate}`);persist();render();toast('Nomination prepared for trainer review');return}
      if(t.dataset.sendOwner){state.ownerSent.add(t.dataset.sendOwner);persist();render();toast('Owner update reviewed and sent');return}
      if(t.dataset.completeTask){state.completed.add(t.dataset.completeTask);persist();closeOverlay();render();toast('Task signed off and added to activity');return}
      if(t.dataset.export){generateExport(t.dataset.export);return}
      if(t.dataset.switch!==undefined){t.classList.toggle('on');t.setAttribute('aria-pressed',String(t.classList.contains('on')));toast('Workspace permission updated in this demo');return}
      if(t.dataset.logType){state.log.type=t.dataset.logType;state.log.step=state.log.dog?3:2;openLog();return}
      if(t.dataset.logDog){if(state.log){state.log.dog=dogBy(t.dataset.logDog);state.log.step=state.log.type?3:1;openLog()}else startLog(t.dataset.logDog,t.dataset.logType);return}
      const a=t.dataset.action;
      if(a==='search')openSearch();else if(a==='notifications')openNotifications();else if(a==='close-overlay')closeOverlay();else if(a==='overlay-close'&&e.target===t)closeOverlay();else if(a==='profile-back')go(state.previousView||'dogs');else if(a==='dog-menu')openDogMenu();else if(a==='open-log'){closeOverlay();startLog(t.dataset.logDog,t.dataset.logType)}else if(a==='log-back'){state.log.step=Math.max(1,state.log.step-1);openLog()}else if(a==='log-next'){state.log.step=4;openLog()}else if(a==='log-save')saveLog();else if(a==='voice-fill'){state.log.data.notes='Bright, alert and moving freely. Activity completed as instructed; no new concern observed.';toast('Voice interpreted — review the structured fields');openLog()}else if(a==='new-owner-update')toast('Editable owner update created from this week’s approved records');
    });
    document.addEventListener('input',e=>{if(e.target.id==='dogSearch'){state.dogQuery=e.target.value;render()}else if(e.target.id==='globalSearch')renderSearch(e.target.value);else if(e.target.dataset.logField)state.log.data[e.target.dataset.logField]=e.target.value});
    document.addEventListener('change',e=>{if(e.target.dataset.logField)state.log.data[e.target.dataset.logField]=e.target.value});
    document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')closeOverlay();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-dog],[data-task]')){e.preventDefault();e.target.click()}});
    document.querySelector('#overlayRoot').addEventListener('click',e=>{if(e.target.classList.contains('overlay'))closeOverlay()});
    const updateNetwork=()=>{const el=document.querySelector('#network');el.classList.toggle('offline',!navigator.onLine);el.querySelector('span').textContent=navigator.onLine?'Saved on device':'Offline · entries queue locally'};window.addEventListener('online',updateNetwork);window.addEventListener('offline',updateNetwork);
    render();updateNetwork();
  })();
  </script>
</body>
</html>
